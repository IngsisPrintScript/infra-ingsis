version: "3.9"

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy-prod
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet-api
      - parser-api
      - ui
    networks:
      - internal

  snippet-api:
    image: ghcr.io/IngsisPrintScript/snippet-api:prod
    container_name: snippet-api-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - internal

  parser-api:
    image: ghcr.io/IngsisPrintScript/parser-api:prod
    container_name: parser-api-prod
    networks:
      - internal

  ui:
    image: ghcr.io/IngsisPrintScript/snippet-ui:prod
    container_name: snippet-ui-prod
    networks:
      - internal

networks:
  internal:
    driver: bridge
