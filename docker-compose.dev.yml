services:

  # ---------------------------------------------------------------------------
  # REVERSE PROXY
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet-service
      - format-service
      - linter-service
      - test-service
      - authentication-service
      - permission-service
      - engine-service          
      - ui                      
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # GLOBAL SERVICES
  # ---------------------------------------------------------------------------

  redis:
    image: redis:6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - snippet-net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - blob:/workspace
    networks:
      - snippet-net

  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    container_name: asset-service
    env_file:
      - env/snippet.env
    depends_on:
      - azurite
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # SNIPPET SERVICE
  # ---------------------------------------------------------------------------

  snippet-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${SNIPPET_DB_USER}
      POSTGRES_PASSWORD: ${SNIPPET_DB_PASS}
      POSTGRES_DB: ${SNIPPET_DB_NAME}
    volumes:
      - snippet-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  snippet-service:
    image: ghcr.io/ingsisprintscript/snippet-service:dev
    container_name: snippet-service
    env_file:
      - env/snippet.env
    depends_on:
      - snippet-db
      - redis
      - asset-service
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # FORMAT SERVICE
  # ---------------------------------------------------------------------------

  format-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${FORMAT_DB_USER}
      POSTGRES_PASSWORD: ${FORMAT_DB_PASS}
      POSTGRES_DB: ${FORMAT_DB_NAME}
    volumes:
      - format-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  format-service:
    image: ghcr.io/ingsisprintscript/format-service:dev
    container_name: format-service
    env_file:
      - env/format.env
    depends_on:
      - format-db
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # LINTER SERVICE
  # ---------------------------------------------------------------------------

  linter-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${LINTER_DB_USER}
      POSTGRES_PASSWORD: ${LINTER_DB_PASS}
      POSTGRES_DB: ${LINTER_DB_NAME}
    volumes:
      - linter-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  linter-service:
    image: ghcr.io/ingsisprintscript/linter-service:dev
    container_name: linter-service
    env_file:
      - env/linter.env
    depends_on:
      - linter-db
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # TEST SERVICE
  # ---------------------------------------------------------------------------

  test-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASS}
      POSTGRES_DB: ${TEST_DB_NAME}
    volumes:
      - test-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  test-service:
    image: ghcr.io/ingsisprintscript/test-service:dev
    container_name: test-service
    env_file:
      - env/test.env
    depends_on:
      - test-db
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------------------------------

  auth-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  authentication-service:
    image: ghcr.io/ingsisprintscript/users-authorization:dev
    container_name: authentication-service
    env_file:
      - env/auth.env
    depends_on:
      - auth-db
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # PERMISSION SERVICE
  # ---------------------------------------------------------------------------

  permission-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${PERMISSION_DB_USER}
      POSTGRES_PASSWORD: ${PERMISSION_DB_PASS}
      POSTGRES_DB: ${PERMISSION_DB_NAME}
    volumes:
      - permission-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  permission-service:
    image: ghcr.io/ingsisprintscript/permission-service:dev
    container_name: permission-service
    env_file:
      - env/permission.env
    depends_on:
      - permission-db
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # ENGINE SERVICE (NUEVO)
  # ---------------------------------------------------------------------------

  engine-service:
    image: ghcr.io/ingsisprintscript/engine-service:dev
    container_name: engine-service
    env_file:
      - env/engine.env    
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # UI SERVICE (NUEVO)
  # ---------------------------------------------------------------------------

  ui:
    build: ../printscript-ui
    container_name: ui
    networks:
      - snippet-net

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  snippet-db:
  format-db:
  linter-db:
  test-db:
  auth-db:
  permission-db:
  redis-data:
  blob:

# ---------------------------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------------------------
networks:
  snippet-net:
    driver: bridge
