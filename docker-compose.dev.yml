services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy-dev
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet
      - engine
      - formatter
      - linter
      - tester
      - ui
      - auth
      - permission
    networks:
      - snippet-net

  snippet:
    image: ghcr.io/ingsisprintscript/snippet-service:dev
    container_name: snippet-dev
    networks:
     - snippet-net

  engine:
    image: ghcr.io/ingsisprintscript/engine-service:dev
    container_name: engine-dev
    networks:
      - snippet-net

  formatter:
    image: ghcr.io/ingsisprintscript/format-service:dev
    container_name: formatter-dev
    networks:
      - snippet-net

  linter:
    image: ghcr.io/ingsisprintscript/linter-service:dev
    container_name: linter-dev
    networks:
      - snippet-net

  tester:
    image: ghcr.io/ingsisprintscript/test-service:dev
    container_name: test-dev
    networks:
     - snippet-net


  ui:
    build: ../printscript-ui
    container_name: ui-dev
    networks:
      - snippet-net
      
  auth: 
    image: ghcr.io/ingsisprintscript/users-authorization:dev
    container_name: user-dev
    networks:
      - snippet-net
      
  permission: 
    image: ghcr.io/ingsisprintscript/permission-service:dev
    container_name: permission-dev
    networks:
     - snippet-net
      
networks:
  snippet-net:
    driver: bridge
