version: "3.9"

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy-dev
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet
      - engine
      - formatter
      - linter
      - tester
      - ui
    networks:
      - internal

  # 🟦 Snippet service → reemplazado por busybox temporalmente
  snippet:
    image: busybox
    container_name: snippet-dev
    command: ["sleep", "3600"]  # para que el contenedor no se cierre
    networks:
      - internal

  # 🟦 Engine service → también reemplazado temporalmente
  engine:
    image: busybox
    container_name: engine-dev
    command: ["sleep", "3600"]
    networks:
      - internal

  formatter:
    build: ../format-service-ingsis
    container_name: formatter-dev
    volumes:
      - /home/MackyAlimena/.gradle:/home/gradle/.gradle
    networks:
      - internal

  linter:
    build: ../lint-snippet-service
    container_name: linter-dev
    volumes:
      - /home/MackyAlimena/.gradle:/home/gradle/.gradle
    networks:
      - internal

  tester:
    image: busybox
    container_name: tester-dev
    command: ["sleep", "3600"]
    networks:
      - internal


  ui:
    build: ../printscript-ui
    container_name: ui-dev
    networks:
      - internal

networks:
  internal:
    driver: bridge
