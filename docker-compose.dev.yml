services:

  # ---------------------------------------------------------------------------
  # REVERSE PROXY
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet
      - formatter
      - linter
      - tester
      - authentication
      - permission
      - engine
      - ui                      
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # GLOBAL SERVICES
  # ---------------------------------------------------------------------------

  redis:
    image: redis:6-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - env/.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - snippet-net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - blob:/workspace
    networks:
      - snippet-net

  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    container_name: asset-service
    env_file:
      - env/.env
    depends_on:
      azurite:
        condition: service_started
    networks:
      - snippet-net


  # ---------------------------------------------------------------------------
  # SNIPPET SERVICE
  # ---------------------------------------------------------------------------

  snippet-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${SNIPPET_USERNAME}
      POSTGRES_PASSWORD: ${SNIPPET_PASSWORD}
      POSTGRES_DB: ${SNIPPET_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SNIPPET_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - snippet-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  snippet:
    image: ghcr.io/ingsisprintscript/snippet-service:dev
    container_name: snippet-service
    env_file:
      - env/.env
    depends_on:
      redis:
        condition: service_healthy
      snippet-db:
        condition: service_healthy
      asset-service:
        condition: service_started
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # FORMAT SERVICE
  # --------------------------------------------------------------------------

  format-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${FORMAT_USERNAME}
      POSTGRES_PASSWORD: ${FORMAT_PASSWORD}
      POSTGRES_DB: ${FORMAT_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FORMAT_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - format-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  formatter:
    image: ghcr.io/ingsisprintscript/format-service:dev
    container_name: format-service
    env_file:
      - env/.env
    depends_on:
      redis:
        condition: service_healthy
      format-db:
        condition: service_healthy
      asset-service:
        condition: service_started
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # LINTER SERVICE
  # ---------------------------------------------------------------------------

  linter-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${LINTER_USERNAME}
      POSTGRES_PASSWORD: ${LINTER_PASSWORD}
      POSTGRES_DB: ${LINTER_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LINTER_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - linter-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  linter:
    image: ghcr.io/ingsisprintscript/linter-service:dev
    container_name: linter-service
    env_file:
      - env/.env
    depends_on:
      redis:
        condition: service_healthy
      linter-db:
        condition: service_healthy
      asset-service:
        condition: service_started
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # TEST SERVICE
  # ---------------------------------------------------------------------------

  test-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${TEST_USERNAME}
      POSTGRES_PASSWORD: ${TEST_PASSWORD}
      POSTGRES_DB: ${TEST_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TEST_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - test-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  tester:
    image: ghcr.io/ingsisprintscript/test-service:dev
    container_name: test-service
    env_file:
      - env/.env
    depends_on:
      redis:
        condition: service_healthy
      test-db:
        condition: service_healthy
      asset-service:
        condition: service_started
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------------------------------

  auth-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${AUTHORIZATION_USERNAME}
      POSTGRES_PASSWORD: ${AUTHORIZATION_PASSWORD}
      POSTGRES_DB: ${AUTHORIZATION_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTHORIZATION_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - auth-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  authentication:
    image: ghcr.io/ingsisprintscript/users-authorization:dev
    container_name: authentication-service
    env_file:
      - env/.env
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # PERMISSION SERVICE
  # ---------------------------------------------------------------------------

  permission-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${PERMISSION_USERNAME}
      POSTGRES_PASSWORD: ${PERMISSION_PASSWORD}
      POSTGRES_DB: ${PERMISSION_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PERMISSION_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/.env
    volumes:
      - permission-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  permission:
    image: ghcr.io/ingsisprintscript/permission-service:dev
    container_name: permission-service
    env_file:
      - env/.env
    depends_on:
      permission-db:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # ENGINE SERVICE (NUEVO)
  # ---------------------------------------------------------------------------

  engine:
    image: ghcr.io/ingsisprintscript/engine-service:dev
    container_name: engine-service
    env_file:
      - env/.env
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # UI SERVICE (NUEVO)
  # ---------------------------------------------------------------------------


  ui:
    build:
      context: ../printscript-ui
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_AUTH0_CALLBACK_URL: ${VITE_AUTH0_CALLBACK_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_USER_BASE_URL: ${VITE_API_USER_BASE_URL}
    container_name: ui
    networks:
      - snippet-net

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  snippet-db:
  format-db:
  linter-db:
  test-db:
  auth-db:
  permission-db:
  redis-data:
  blob:

# ---------------------------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------------------------
networks:
  snippet-net:
    driver: bridge
