version: "3.9"

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy-dev
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet
      - engine
      - formatter
      - linter
      - tester
      - ui
    networks:
      - internal

  snippet:
    build: ../snippet-service-ingsis
    container_name: snippet-dev
    networks:
      - internal

  engine:
    build: ../engine-service-ingsis
    container_name: engine-dev
    networks:
      - internal

  formatter:
    build: ../format-service-ingsis
    container_name: formatter-dev
    networks:
      - internal

  linter:
    build: ../lint-snippet-service
    container_name: linter-dev
    networks:
      - internal

  tester:
    build: ../test-snippet-service-ingsis
    container_name: tester-dev
    networks:
      - internal

  ui:
    build: ../printscript-ui   
    container_name: ui-dev
    networks:
      - internal

networks:
  internal:
    driver: bridge
