services:

  # ---------------------------------------------------------------------------
  # REVERSE PROXY
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - snippet
      - formatter
      - linter
      - tester
      - authentication
      - permission
      - engine
      - ui                      
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # GLOBAL SERVICES
  # ---------------------------------------------------------------------------

  redis:
    image: redis:6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - snippet-net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - blob:/workspace
    networks:
      - snippet-net

  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    container_name: asset-service
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - env/snippet.env
    depends_on:
      - azurite
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # SNIPPET SERVICE
  # ---------------------------------------------------------------------------

  snippet-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - snippet-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  snippet:
    image: ghcr.io/ingsisprintscript/snippet-service:dev
    container_name: snippet-service
    env_file:
      - env/snippet.env
    depends_on:
      redis:
        condition: service_healthy
      snippet-db:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # FORMAT SERVICE
  # ---------------------------------------------------------------------------

  format-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - format-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  formatter:
    image: ghcr.io/ingsisprintscript/format-service:dev
    container_name: format-service
    env_file:
      - env/format.env
    depends_on:
      redis:
        condition: service_healthy
      format-db:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # LINTER SERVICE
  # ---------------------------------------------------------------------------

  linter-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - linter-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  linter:
    image: ghcr.io/ingsisprintscript/linter-service:dev
    container_name: linter-service
    env_file:
      - env/linter.env
    depends_on:
      redis:
        condition: service_healthy
      linter-db:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # TEST SERVICE
  # ---------------------------------------------------------------------------

  test-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - test-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  tester:
    image: ghcr.io/ingsisprintscript/test-service:dev
    container_name: test-service
    env_file:
      - env/test.env
    depends_on:
      redis:
        condition: service_healthy
      test-db:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------------------------------

  auth-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - auth-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  authentication:
    image: ghcr.io/ingsisprintscript/users-authorization:dev
    container_name: authentication-service
    env_file:
      - env/authorization.env
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # PERMISSION SERVICE
  # ---------------------------------------------------------------------------

  permission-db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - permission-db:/var/lib/postgresql/data
    networks:
      - snippet-net

  permission:
    image: ghcr.io/ingsisprintscript/permission-service:dev
    container_name: permission-service
    env_file:
      - env/permission.env
    depends_on:
      permission-db:
        condition: service_healthy
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # ENGINE SERVICE (NUEVO)
  # ---------------------------------------------------------------------------

  engine:
    image: ghcr.io/ingsisprintscript/engine-service:dev
    container_name: engine-service
    env_file:
      - env/engine.env    
    networks:
      - snippet-net

  # ---------------------------------------------------------------------------
  # UI SERVICE (NUEVO)
  # ---------------------------------------------------------------------------

  ui:
    build: ../printscript-ui
    container_name: ui
    networks:
      - snippet-net
    ports:
      - "5173:5173"

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  snippet-db:
  format-db:
  linter-db:
  test-db:
  auth-db:
  permission-db:
  redis-data:
  blob:

# ---------------------------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------------------------
networks:
  snippet-net:
    driver: bridge
