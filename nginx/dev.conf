# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name snippet-dev.duckdns.org;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name snippet-dev.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/snippet-dev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snippet-dev.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # -------------------------
    # FRONTEND (UI)
    # -------------------------
    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /callback {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # SNIPPET SERVICE
    # -------------------------
    location /snippet/ {
        proxy_pass http://snippet-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # ENGINE SERVICE
    # -------------------------
    location /engine/ {
        proxy_pass http://engine-service:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # FORMAT SERVICE
    # -------------------------
    location /format/ {
        proxy_pass http://formatter:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # LINTER SERVICE
    # -------------------------
    location /lint/ {
        proxy_pass http://linter-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # TEST SERVICE
    # -------------------------
    location /test-snippet/ {
        proxy_pass http://tester:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # AUTH SERVICE
    # -------------------------
    location /auth/ {
        proxy_pass http://authentication-service:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # PERMISSION SERVICE
    # -------------------------
    location /permission/ {
        proxy_pass http://permission-service:8086/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
