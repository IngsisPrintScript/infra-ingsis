events {
    worker_connections 1024;
}

http {

    # ------------------------------------------------------------
    # HTTP → HTTPS
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name snippet-dev.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------
    # HTTPS
    # ------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name snippet-dev.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/snippet-dev.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snippet-dev.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # ------------------------------------------------------------
        # SNIPPET SERVICE
        # /snippet-service/** → snippet-service:8081/**
        # ------------------------------------------------------------
        location /snippet-service/ {
            proxy_pass http://snippet-service:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------------------------------------
        # AUTH / USERS
        # /auth/** → authentication-service:8085/**
        # ------------------------------------------------------------
        location /auth/ {
            proxy_pass http://authentication-service:8085/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------------------------------------
        # PERMISSION SERVICE
        # /permission/** → permission-service:8086/**
        # ------------------------------------------------------------
        location /permission/ {
            proxy_pass http://permission-service:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------------------------------------
        # ENGINE SERVICE
        # /engine/** → engine-service:8088/**
        # ------------------------------------------------------------
        location /engine/ {
            proxy_pass http://engine-service:8088/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # ------------------------------------------------------------
        # FRONTEND (SPA) — SIEMPRE AL FINAL
        # ------------------------------------------------------------
        location / {
            proxy_pass http://ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
