server {
    listen 80;
    server_name snippet-prod.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name snippet-prod.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/snippet-prod.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snippet-prod.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://snippet-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /parser/ {
        proxy_pass http://parser-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
